<!--
THESIS: An index, not a scene. Five trackers set as one quiet list where the
numbers and the covers are the only ornament. Refuses the card grid, and refuses
decoration standing in for content.
OWN-WORLD: A 16:5 banner masked to nothing at its foot, then near-white paper
and a single deep green. One type family at four fixed steps, hairline rules,
generous air. Numbers large and light in tabular figures; five poster slots per
entry, empty ones kept as quiet plates rather than hidden.
STORY: A friend reads down the list, sees what Kahfi watches, reads and plays,
recognises a few covers, and can step to any profile from its line.
FIRST VIEWPORT: The banner runs full width and dissolves into the page. Under
it a single measured column: title, one line of intro, then the list.
FORM: The reading index. Chosen from the safer register at the user's request,
after two committed worlds were declined. Seed key 7f751cdc.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, docs/DESIGN.md, and every shipping raster carrying its
provenance.
ANTISLOP DIALS: ENERGY 1 / RHYTHM 1 / MOTION 1.
NUMBERS: hand-kept in content.json. The page never claims they are live.
-->

  <main>

      <li class="state"><p class="state__line">Reading the list&hellip;</p></li>
    </ol>
  </main>

  <footer class="colophon">
    <p class="colophon__note" id="note" hidden></p>
    <p class="colophon__credit" id="credit" hidden></p>

      <span id="byline">Kept by Kahfi R.</span> The numbers are entered by hand in
      <a id="repo" href="https://github.com/nrkahfirhmd/personal-sanctuary">content.json</a>
      and carry the date they were last touched, so they are as current as the last time I sat down with
      them, not as current as the profiles themselves.
    </p>
  </footer>
</div>

<script>
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const POSTER_SLOTS = 5;
  const STAT_SLOTS = 3;

  const list = document.getElementById('index');
  const note = document.getElementById('note');
  const credit = document.getElementById('credit');

  const pretty = (iso) => {
    const d = new Date(`${iso}T00:00:00Z`);
    return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  };

  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  };

  function buildEntry(entry) {
    const stats = (entry.stats ?? []).slice(0, STAT_SLOTS);
    const posters = (entry.posters ?? []).slice(0, POSTER_SLOTS);

    const item = el('li', 'entry');

    const link = el('a', 'entry__link');
    link.href = entry.url;
    link.rel = 'me noopener';

    const head = el('div', 'entry__head');
    head.append(el('h3', 'entry__hobby', entry.hobby));
    const meta = el('p', 'entry__meta');
    meta.append(el('span', null, entry.name), el('span', 'entry__user', entry.username));
    head.append(meta);
    head.append(
      el('p', 'entry__when', entry.updated ? `updated ${pretty(entry.updated)}` : 'nothing entered yet')
    );
    link.append(head);

    if (stats.length) {
      const dl = el('dl', 'entry__stats');
      for (const { value, label } of stats) {
        const pair = el('div', 'stat');
        // Value before label in the source so a screen reader reaches the number
        // first; the visual order is reversed in CSS.
        pair.append(el('dd', 'stat__value', value), el('dt', 'stat__label', label));
        dl.append(pair);
      }
      link.append(dl);
    } else {
      link.append(el('p', 'entry__none', 'no numbers entered yet'));
    }

    // Five slots, always. An empty slot is drawn as a plate rather than hidden,
    // so the row keeps its rhythm whether one cover is filled in or five.
    const strip = el('ul', 'posters');
    for (let i = 0; i < POSTER_SLOTS; i += 1) {
      const slot = el('li', 'poster');
      const url = posters[i];
      if (url) {
        const img = el('img', 'poster__img');
        img.src = url;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        // An image that will not load falls back to the empty plate rather than
        // leaving a broken-image glyph in the strip.
        img.addEventListener('error', () => slot.classList.add('poster--empty'), { once: true });
        slot.append(img);
      } else {
        slot.classList.add('poster--empty');
      }
      strip.append(slot);
    }
    link.append(strip);

    item.append(link);
    return item;
  }

  function renderState(line, why, onRetry) {
    const item = el('li', 'state');
    item.append(el('p', 'state__line', line));
    if (why) item.append(el('p', 'state__why', why));
    if (onRetry) {
      const retry = el('button', 'state__retry', 'Try again');
      retry.type = 'button';
      retry.addEventListener('click', onRetry);
      item.append(retry);
    }
    list.replaceChildren(item);
  }

  function applySite(content) {
    const site = content.site ?? {};
    if (site.title) document.getElementById('title').textContent = site.title;
    document.getElementById('intro').textContent = site.intro ?? '';
    if (site.byline) document.getElementById('byline').textContent = site.byline;
    if (site.repo) document.getElementById('repo').href = site.repo;

    const b = content.backdrop ?? {};
    if (b.webm) document.getElementById('backdrop-webm').src = b.webm;
    if (b.mp4) document.getElementById('backdrop-mp4').src = b.mp4;
    if (b.poster) {
      document.getElementById('backdrop-media').poster = b.poster;
      // The reduced-motion still is painted by CSS, so the path has to reach it.
      document.documentElement.style.setProperty('--backdrop-poster', `url("${b.poster}")`);
    }
    // Someone drew this. Credit them on the page, not only in the JSON.
    credit.hidden = !b.credit;
    if (b.credit) credit.textContent = `${b.creditNote ?? 'Backdrop art by'} ${b.credit}.`;
  }

  function render(content) {
    applySite(content);
    const gateways = content.gateways ?? [];
    if (!gateways.length) return renderState('Nothing is on the list yet.');
    list.replaceChildren(...gateways.map(buildEntry));

    const empty = gateways.filter((g) => !(g.stats ?? []).length);
    note.hidden = empty.length === 0;
    if (empty.length) {
      const names = empty.map((g) => g.name);
      const listed = names.length > 1 ? `${names.slice(0, -1).join(', ')} and ${names.at(-1)}` : names[0];
      note.textContent = `${listed} ${empty.length > 1 ? 'have' : 'has'} no numbers entered yet, so ${
        empty.length > 1 ? 'those entries are' : 'that entry is'
      } blank rather than showing a zero.`;
    }
  }

  function baked() {
    try {
      const parsed = JSON.parse(document.getElementById('baked-data').textContent);
      return parsed && Array.isArray(parsed.gateways) && parsed.gateways.length ? parsed : null;
    } catch {
      return null;
    }
  }

  async function load() {
    list.setAttribute('aria-busy', 'true');
    try {
      const res = await fetch(`content.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`content.json responded ${res.status}`);
      render(await res.json());
    } catch (error) {
      // Opened off the disk, fetch cannot read a sibling file on a file://
      // origin. The baked copy keeps the page readable.
      const fallback = baked();
      if (!fallback) return renderState('The list would not load.', error.message ?? String(error), load);
      render(fallback);
    } finally {
      list.removeAttribute('aria-busy');
    }
  }

  load();
</script>
